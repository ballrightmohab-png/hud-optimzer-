name: Build HUD Optimizer

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls -la "$ANDROID_HOME/ndk" || true

      - name: Find Android NDK
        shell: bash
        run: |
          NDK_PATH="$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"

          if [ -z "$NDK_PATH" ]; then
            echo "ERROR: No Android NDK found."
            exit 1
          fi

          echo "Using NDK: $NDK_PATH"
          echo "NDK_PATH=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Configure CMake
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build HUD Optimizer
        run: |
          cmake --build build \
            --config Release \
            --parallel 2

      - name: Prepare output
        run: |
          mkdir -p output/lib

          cp build/libhud_optimizer.so \
             output/lib/libhud_optimizer.so

          cp manifest.json \
             output/manifest.json

          echo "Build output:"
          find output -type f -print

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: HUDOptimizer-ARM64
          path: output/
