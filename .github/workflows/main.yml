name: Build HUD Optimizer

on:
  push:
    branches:
      - main
      - experimental/*
      - "**/hud-optimizer-rewrite"
  pull_request:
    branches:
      - main
      - experimental/*
  workflow_dispatch:

jobs:
  build:
    name: Build HUD Optimizer ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android NDK
        shell: bash
        run: |
          NDK_PATH="$(find "$ANDROID_HOME/ndk" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)"

          if [ -z "$NDK_PATH" ]; then
            echo "ERROR: Android NDK not found."
            echo "Available NDK directory content:"
            ls -la "$ANDROID_HOME/ndk/" || echo "NDK directory not found"
            exit 1
          fi

          echo "✓ Using NDK: $NDK_PATH"
          echo "NDK_PATH=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Configure CMake
        shell: bash
        run: |
          echo "Configuring CMake with ARM64 target..."
          
          cmake \
            -S . \
            -B build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_VERBOSE_MAKEFILE=ON

          if [ $? -ne 0 ]; then
            echo "ERROR: CMake configuration failed."
            exit 1
          fi

          echo "✓ CMake configuration successful"

      - name: Build HUD Optimizer
        shell: bash
        run: |
          echo "Building HUD Optimizer..."
          
          cmake \
            --build build \
            --config Release \
            --parallel $(nproc)

          if [ $? -ne 0 ]; then
            echo "ERROR: Build failed."
            exit 1
          fi

          echo "✓ Build completed successfully"

      - name: Find built library
        shell: bash
        run: |
          echo "Searching for libhud_optimizer.so..."

          SO_PATH="$(find build \
            -type f \
            -name "libhud_optimizer.so" \
            | head -n 1)"

          if [ -z "$SO_PATH" ]; then
            echo "ERROR: libhud_optimizer.so was not built."
            echo "Build artifacts found:"
            find build -type f -executable
            exit 1
          fi

          echo "✓ Found: $SO_PATH"
          file "$SO_PATH"
          ls -lh "$SO_PATH"
          
          echo "SO_PATH=$SO_PATH" >> "$GITHUB_ENV"

      - name: Verify manifest.json
        shell: bash
        run: |
          if [ ! -f manifest.json ]; then
            echo "ERROR: manifest.json not found in root directory"
            exit 1
          fi

          echo "✓ manifest.json found"
          cat manifest.json

      - name: Prepare LeviPack
        shell: bash
        run: |
          echo "Preparing package contents..."
          
          rm -rf package
          mkdir -p package

          cp "$SO_PATH" package/libhud_optimizer.so
          cp manifest.json package/manifest.json

          echo "✓ Package contents:"
          find package -type f -exec ls -lh {} \;

      - name: Verify package files
        shell: bash
        run: |
          test -f package/manifest.json || { echo "ERROR: manifest.json missing"; exit 1; }
          test -f package/libhud_optimizer.so || { echo "ERROR: libhud_optimizer.so missing"; exit 1; }

          echo "✓ Package files verified"
          
          file package/libhud_optimizer.so
          file package/manifest.json

      - name: Install ZIP utility
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip unzip

      - name: Create LeviPack
        shell: bash
        run: |
          echo "Creating LeviPack ZIP archive..."
          
          cd package

          zip -9 -v \
            ../HUDOptimizer-ARM64.levipack \
            manifest.json \
            libhud_optimizer.so

          if [ $? -ne 0 ]; then
            echo "ERROR: Failed to create LeviPack ZIP"
            exit 1
          fi

          cd ..

          echo "✓ LeviPack created:"
          ls -lh HUDOptimizer-ARM64.levipack

      - name: Verify LeviPack ZIP
        shell: bash
        run: |
          echo "========== LEVIPACK STRUCTURE =========="
          unzip -l HUDOptimizer-ARM64.levipack

          echo -e "\n========== ZIP INTEGRITY TEST =========="
          if unzip -t HUDOptimizer-ARM64.levipack; then
            echo "✓ LeviPack ZIP verification successful"
          else
            echo "ERROR: ZIP integrity check failed"
            exit 1
          fi

          echo -e "\n========== SHA-256 CHECKSUM =========="
          sha256sum HUDOptimizer-ARM64.levipack

      - name: Upload LeviPack Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HUDOptimizer-ARM64-LeviPack
          path: HUDOptimizer-ARM64.levipack
          if-no-files-found: error
          retention-days: 30

      - name: Build Summary
        shell: bash
        run: |
          echo "========== BUILD SUMMARY =========="
          echo "✓ HUD Optimizer ARM64 built successfully"
          echo "✓ Output: HUDOptimizer-ARM64.levipack"
          echo "✓ Ready for distribution"
